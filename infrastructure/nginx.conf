# ⚠️ VULNERABLE BY DESIGN - DO NOT USE IN PRODUCTION ⚠️
#
# NGINX Configuration with INTENTIONAL vulnerabilities:
# - Debug endpoints exposed
# - Internal routes accessible
# - Server version disclosure
# - No rate limiting
# - Weak SSL configuration
# - Path traversal possible

# VULNERABILITY: Running as root
user root;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # VULNERABILITY: Detailed logging with sensitive data
    log_format detailed '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        '"$http_authorization" "$http_cookie"'  # Logging auth headers and cookies!
                        '"$request_body"';  # Logging request bodies (passwords!)

    access_log /var/log/nginx/access.log detailed;
    error_log /var/log/nginx/error.log debug;  # VULNERABILITY: Debug level logging

    # VULNERABILITY: Server version exposure
    server_tokens on;

    # VULNERABILITY: Directory listing enabled
    autoindex on;

    server {
        listen 80;
        listen 443 ssl;
        server_name _;

        # ============================================================
        # VULNERABILITY: Weak SSL Configuration
        # ============================================================

        # VULNERABILITY: Self-signed/weak certificate
        ssl_certificate /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;

        # VULNERABILITY: SSLv3 and weak TLS versions enabled
        ssl_protocols SSLv3 TLSv1 TLSv1.1 TLSv1.2;

        # VULNERABILITY: Weak cipher suites
        ssl_ciphers 'EXPORT:DES-CBC3-SHA:RC4:aNULL:eNULL:MD5';
        ssl_prefer_server_ciphers off;

        # VULNERABILITY: No HSTS header
        # Missing: add_header Strict-Transport-Security

        root /var/www/html;
        index index.html index.php;

        # ============================================================
        # VULNERABILITY: Internal/Debug Endpoints Exposed
        # ============================================================

        # VULNERABILITY: Server status exposed
        location /nginx_status {
            stub_status on;
            # No access restriction!
        }

        # VULNERABILITY: PHP-FPM status exposed
        location /fpm_status {
            fastcgi_pass unix:/run/php-fpm.sock;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # VULNERABILITY: Internal health check exposed
        location /internal/health {
            proxy_pass http://backend:8080/actuator/health;
        }

        # VULNERABILITY: Actuator endpoints exposed (CVE-2022-22947 pattern)
        location /actuator {
            proxy_pass http://backend:8080/actuator;
            # No authentication required!
        }

        # VULNERABILITY: Environment variables exposed
        location /actuator/env {
            proxy_pass http://backend:8080/actuator/env;
        }

        # VULNERABILITY: Heap dump accessible (memory with secrets!)
        location /actuator/heapdump {
            proxy_pass http://backend:8080/actuator/heapdump;
        }

        # VULNERABILITY: Debug variables exposed
        location /debug/vars {
            proxy_pass http://backend:8080/debug/vars;
        }

        # VULNERABILITY: Prometheus metrics with potential secrets
        location /metrics {
            proxy_pass http://backend:8080/metrics;
        }

        # ============================================================
        # VULNERABILITY: Admin Interfaces Without Auth
        # ============================================================

        # VULNERABILITY: Admin panel no auth
        location /admin {
            proxy_pass http://backend:8080/api/admin;
            # No authentication!
        }

        # VULNERABILITY: Database admin exposed
        location /adminer {
            proxy_pass http://adminer:8080;
        }

        # VULNERABILITY: Jenkins exposed
        location /jenkins {
            proxy_pass http://jenkins:8080;
        }

        # ============================================================
        # VULNERABILITY: Path Traversal Possible
        # ============================================================

        # VULNERABILITY: Alias misconfiguration allows path traversal
        location /files {
            alias /var/www/files;  # Missing trailing slash!
            # Attack: /files../etc/passwd
        }

        # VULNERABILITY: Another path traversal via symlinks
        location /uploads {
            alias /tmp/uploads/;
            disable_symlinks off;  # Symlinks followed!
        }

        # ============================================================
        # VULNERABILITY: SSRF via proxy
        # ============================================================

        # VULNERABILITY: User-controlled proxy destination
        location /proxy {
            # Attacker can use: /proxy?url=http://169.254.169.254/
            set $target_url $arg_url;
            proxy_pass $target_url;
        }

        # ============================================================
        # VULNERABILITY: Git Directory Exposed
        # ============================================================

        # VULNERABILITY: .git directory accessible
        location /.git {
            # Should be: return 404; or deny all;
            autoindex on;  # Lists all files!
        }

        # VULNERABILITY: Environment files accessible
        location ~ /\.(env|git|htaccess|htpasswd) {
            # Should deny access but allows it
            autoindex on;
        }

        # ============================================================
        # VULNERABILITY: Backend Bypass
        # ============================================================

        # VULNERABILITY: Direct database access
        location /direct-db {
            proxy_pass http://postgres:5432;
        }

        # VULNERABILITY: Redis access without auth
        location /redis {
            proxy_pass http://redis:6379;
        }

        # ============================================================
        # VULNERABILITY: WebSocket with no origin check
        # ============================================================

        location /ws {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # No origin validation!
        }

        # ============================================================
        # VULNERABILITY: PHP Execution in Upload Directory
        # ============================================================

        location /uploads {
            location ~ \.php$ {
                # VULNERABILITY: PHP execution in upload directory!
                fastcgi_pass unix:/run/php-fpm.sock;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            }
        }

        # ============================================================
        # VULNERABILITY: Missing Security Headers
        # ============================================================
        # Should have:
        # - Content-Security-Policy
        # - X-Frame-Options
        # - X-Content-Type-Options
        # - X-XSS-Protection
        # - Referrer-Policy

        # VULNERABILITY: Allowing embedding from any site
        add_header X-Frame-Options "";

        # VULNERABILITY: CORS allows everything
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "*";
        add_header Access-Control-Allow-Headers "*";
        add_header Access-Control-Allow-Credentials "true";

        # ============================================================
        # VULNERABILITY: No Rate Limiting
        # ============================================================
        # Missing: limit_req_zone and limit_req directives
        # Allows brute force attacks, DoS, etc.

        # ============================================================
        # VULNERABILITY: Request Smuggling Possible
        # ============================================================

        # Not properly handling Content-Length and Transfer-Encoding
        proxy_request_buffering off;

        # ============================================================
        # VULNERABILITY: Backup Files Accessible
        # ============================================================

        location ~* \.(bak|backup|old|orig|save|sql|tar|zip|gz)$ {
            # Should deny access to backup files
            autoindex on;
        }
    }
}
