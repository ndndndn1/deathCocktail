# ============================================================
# VULNERABILITY: Ingress with no authentication
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: death-cocktail-ingress
  annotations:
    # VULNERABILITY: No authentication
    nginx.ingress.kubernetes.io/auth-type: ""
    # VULNERABILITY: Allows any backend
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # VULNERABILITY: No rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "0"
    # VULNERABILITY: CORS allows everything
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
spec:
  rules:
  - host: "*"  # VULNERABILITY: Wildcard host
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: death-cocktail-backend
            port:
              number: 8080

      # VULNERABILITY: Internal paths exposed
      - path: /actuator
        pathType: Prefix
        backend:
          service:
            name: actuator-service
            port:
              number: 8080

      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: internal-admin
            port:
              number: 9090

      - path: /internal
        pathType: Prefix
        backend:
          service:
            name: internal-admin
            port:
              number: 9090
