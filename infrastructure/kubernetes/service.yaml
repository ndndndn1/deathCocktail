# ⚠️ VULNERABLE BY DESIGN - DO NOT USE IN PRODUCTION ⚠️
#
# Kubernetes Service with INTENTIONAL vulnerabilities:
# - NodePort exposing internal services
# - No network policies
# - Debug endpoints exposed
# - Internal services accessible externally

apiVersion: v1
kind: Service
metadata:
  name: death-cocktail-backend
  labels:
    app: death-cocktail
spec:
  type: NodePort  # VULNERABILITY: Exposes on every node
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080  # VULNERABILITY: Fixed nodePort - predictable
  - name: debug
    port: 9090
    targetPort: 9090
    nodePort: 30090  # VULNERABILITY: Debug port exposed
  - name: jmx
    port: 1099
    targetPort: 1099
    nodePort: 31099  # VULNERABILITY: JMX exposed (RCE possible)
  selector:
    app: death-cocktail

