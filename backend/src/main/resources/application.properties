# ============================================================
# ACTUATOR ENDPOINTS - ALL EXPOSED
# ============================================================
# VULNERABILITY: All actuator endpoints exposed without auth!
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always

# VULNERABILITY: Sensitive endpoints exposed
management.endpoint.shutdown.enabled=true
management.endpoint.restart.enabled=true
management.endpoint.loggers.enabled=true
management.endpoint.heapdump.enabled=true
management.endpoint.threaddump.enabled=true
management.endpoint.jolokia.enabled=true

# ============================================================
# DEBUG & DEVELOPMENT
# ============================================================
# VULNERABILITY: Debug mode in production!
debug=true
spring.devtools.restart.enabled=true

# VULNERABILITY: Detailed error pages
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# VULNERABILITY: Remote debugging enabled
spring.jmx.enabled=true

# ============================================================
# SECURITY - DISABLED
# ============================================================
# VULNERABILITY: Spring Security disabled
spring.security.enabled=false
security.basic.enabled=false

# VULNERABILITY: CSRF disabled
spring.security.csrf.enabled=false

# VULNERABILITY: Frame options disabled (clickjacking)
security.headers.frame=false

# ============================================================
# SESSION & COOKIES
# ============================================================
# VULNERABILITY: Insecure session configuration
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=false
server.servlet.session.timeout=24h

# ============================================================
# FILE UPLOAD - NO LIMITS
# ============================================================
# VULNERABILITY: No file size limits
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

# ============================================================
# CORS - WIDE OPEN
# ============================================================
# VULNERABILITY: CORS allows everything
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=*
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true

