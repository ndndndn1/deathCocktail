# ⚠️ VULNERABLE BY DESIGN - DO NOT USE IN PRODUCTION ⚠️
#
# Spring Boot Configuration with INTENTIONAL vulnerabilities

# ============================================================
# DATABASE - INSECURE CONFIGURATION
# ============================================================
spring.datasource.url=jdbc:postgresql://db.company.com:5432/production
spring.datasource.username=root
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# VULNERABILITY: SQL logging enabled with parameters!
spring.jpa.show-sql=true
